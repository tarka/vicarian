name: "Tests"

on: [push]

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      RUST_LOG: "debug"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Pebble
        run: sudo apt update & sudo apt install -y pebble

      - name: Run tests
        run: cargo test --workspace
